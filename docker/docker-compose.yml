services:
  postgres:
    image: postgres:17
    container_name: infinity-postgres
    environment:
      POSTGRES_USER: infinity
      POSTGRES_PASSWORD: infinity
      POSTGRES_DB: infinity
    ports:
      - '5432:5432'
    volumes:
      - infinity_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: infinity-redis
    ports:
      - '6379:6379'

volumes:
  infinity_postgres:
