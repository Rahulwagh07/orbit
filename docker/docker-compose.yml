# docker compose -f docker/docker-compose.yml --env-file .env.local up -d
services:
  postgres:
    image: postgres:17
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.local (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.local (see .env.example)}
    ports:
      - '5432:5432'
    volumes:
      - orbit_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    ports:
      - '6379:6379'

volumes:
  orbit_postgres:
